{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem("hef-theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
            theme = "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
        </script>

        <title>{% block title %} Healthy Eco Foody {% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
        {% block head %}{% endblock %}
    </head>

    <body>
        {% include "components/header.html" %}

        {% block content %}{% endblock content %}

        {% include "components/footer.html" %}

        <div id="toast-container" class="toast-container position-fixed p-3 hef-toast-stack">
            {% include "partials/toasts.html" %}
        </div>

        {% block script %}{% endblock script %}

        <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

        <script src="{% static 'js/toasts.js' %}"></script>
        <script src="{% static 'js/theme.js' %}"></script>
    </body>
</html>
