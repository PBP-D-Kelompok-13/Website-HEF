<div class="modal-header compare-picker-heading">
    <h2 id="compare-save-dialog-title">Comparison saved</h2>

    <button type="button"
            class="compare-picker-icon-button"
            data-bs-dismiss="modal"
            aria-label="Close save comparison dialog">
        <span aria-hidden="true">×</span>
    </button>
</div>

<div class="modal-body compare-picker-body">
    <p id="compare-save-confirmation" role="status">
        Comparison “{{ comparison.title }}” saved.
    </p>
</div>
