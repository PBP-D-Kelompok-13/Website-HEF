<form class="hef-profile-form hef-password-change-form" hx-post="{% url 'main:change_password' %}">
    {% csrf_token %}

    {% for field in form %}
        <div class="hef-profile-info-card hef-profile-field">
            <label for="{{ field.id_for_label }}" class="hef-profile-info-title">
                {{ field.label }}
            </label>
            {{ field }}

            {% for error in field.errors %}
                <p class="hef-profile-error">{{ error }}</p>
            {% endfor %}
        </div>
    {% endfor %}

    {% if form.non_field_errors %}
        <div class="hef-profile-error">{{ form.non_field_errors }}</div>
    {% endif %}

    <div class="hef-profile-form-actions d-flex flex-column flex-sm-row justify-content-sm-end gap-2">
        <button type="submit" class="btn-hef-primary">Save Password</button>
        <button
            type="button"
            class="btn-hef-secondary"
            hx-get="{% url 'main:show_profile_details' %}"
        >
            Cancel
        </button>
    </div>
</form>
