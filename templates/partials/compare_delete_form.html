<div class="modal-header compare-picker-heading">
    <h2 id="compare-delete-dialog-title">Delete comparison?</h2>
    <button type="button"
            class="compare-picker-icon-button"
            data-bs-dismiss="modal"
            aria-label="Close delete comparison dialog">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body compare-picker-body">
    <p class="compare-delete-copy">
        Delete <strong>{{ comparison.title }}</strong> from your saved comparisons?
        This cannot be undone. Products in Discover will remain available.
    </p>
    <form method="post"
          action="{% url 'main:compare_saved_delete' comparison.pk %}"
          hx-post="{% url 'main:compare_saved_delete' comparison.pk %}"
          hx-target="#compare-delete-content"
          hx-swap="innerHTML"
          hx-sync="this:drop"
          hx-disabled-elt="find button"
          hx-indicator="#compare-delete-loading"
          hx-request='{"timeout":10000}'>
        {% csrf_token %}
        <input type="hidden" name="confirm" value="yes">
        {% for error in errors %}
            <p class="compare-validation" role="alert">{{ error }}</p>
        {% endfor %}
        <div class="compare-save-actions">
            <button type="button"
                    id="compare-delete-cancel"
                    class="btn-hef-secondary"
                    data-bs-dismiss="modal">
                Cancel
            </button>
            <button type="submit" class="btn-hef-danger">
                Yes, delete
            </button>
        </div>
    </form>
    <span id="compare-delete-loading"
          class="htmx-indicator compare-muted"
          role="status">Deleting comparison...</span>
    <p id="compare-delete-feedback"
       class="compare-validation"
       role="alert"
       hidden></p>
</div>
